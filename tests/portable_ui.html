<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><iframe id="app" width="1440" height="1000" src="/"></iframe><script>
document.querySelector('#app').onload=()=>setTimeout(async()=>{const checks=[];try{
const w=document.querySelector('#app').contentWindow,d=w.document,check=(ok,label)=>{if(!ok)throw Error(label);checks.push(label)};
const appConfig=await (await w.fetch('/api/app-config')).json();check(d.querySelector('#appName').textContent===appConfig.name,'Configured application brand');
check(!d.querySelector('#referenceButton')&&!d.querySelector('audio[src*="/files/"]'),'No private reference or audition dependency');
check(w.eval('config.rate')===(appConfig.default_rate||'+0%'),'Portable default rate');
check([...d.querySelector('#voice').options].filter(o=>/Yunyang|Yunxi|Yunjian|YunJhe|Yunxia/.test(o.value)).length===5,'Five male voice choices retained');
const calls=[],original=w.fetch.bind(w),fixture={id:'fixture',status:'prepared',request:{content_type:'general',story_framework:'source_order',voice:'zh-CN-YunxiNeural',rate:'+25%',format:'landscape'},sources:[],plan:{title:'示例项目',blocks:[{id:'b1',chapter:'目标与方法',narration:'这是一个普通内容示例。',evidence:[],shots:[]}],source_issues:[],unused_sources:[]}};
w.fetch=async(url,options)=>{let result;if(url==='/api/job?id=fixture')result=fixture;else if(url==='/api/status')result={active:false,logs:[]};else if(url==='/api/plan'||url==='/api/render'||url==='/api/create'||url==='/api/replan'){calls.push({url,body:JSON.parse(options.body)});result={saved:true,job_id:'fixture'}}else return original(url,options);return new w.Response(JSON.stringify(result),{headers:{'Content-Type':'application/json'}})};
await w.eval("loadJob('fixture')");check(d.querySelector('#voice').value==='zh-CN-YunxiNeural'&&w.eval('config.rate')==='+25%','Loaded task preferences preserved');check(d.querySelector('#contentType').value==='general','Content type restored');check(d.querySelector('#storyFramework').value==='source_order','Story framework restored');check([...d.querySelector('#storyFramework').options].map(o=>o.value).join(',')==='auto,problem_solution,source_order','All story frameworks available');
const graph={title:'反馈过程',note:'原理示意',nodes:[{id:'a',label:'输入',x:.5,y:.4}],edges:[],stages:[{cue:'',active_nodes:['a'],active_edges:[],visible_nodes:['a']}]};fixture.plan.blocks[0].shots=[{kind:'diagram',source_id:'',in:0,duration:8,bbox:[],focus:[],keep_full:false,label:'反馈过程',card_text:'',cue:'',diagram:graph}];await w.eval("loadJob('fixture')");check(d.querySelector('.shot-mini small').textContent.includes('旁白驱动动态图'),'Diagram kind displayed');w.eval('openShot(0,0)');check(d.querySelector('#shotSource').value==='diagram','Diagram editor preserves source type');d.querySelector('#shotLabel').value='反馈更新';d.querySelector('#shotForm').onsubmit({preventDefault(){}});check(w.eval('state.job.plan.blocks[0].shots[0].kind')==='diagram'&&JSON.stringify(w.eval('state.job.plan.blocks[0].shots[0].diagram'))===JSON.stringify(graph),'Diagram survives ordinary editor changes');
d.querySelector('#storyFramework').value='problem_solution';d.querySelector('#storyFramework').dispatchEvent(new w.Event('change'));check(d.querySelector('#storyFrameworkHint').textContent.includes('保留原文'),'Existing narration remains protected');d.querySelector('#voice').value='zh-CN-YunjianNeural';w.eval("config.rate='+50%'");await d.querySelector('#renderButton').onclick();const sent=calls.find(c=>c.url==='/api/render');check(sent?.body.speech.voice==='zh-CN-YunjianNeural'&&sent.body.speech.rate==='+50%','Render still sends selected voice and rate');check(sent.body.content_type==='general','Render preserves content type');check(sent.body.story_framework==='problem_solution','Render sends story framework');check(calls.find(c=>c.url==='/api/plan')?.body.story_framework==='problem_solution','Save sends story framework');w.eval('state.active=false');await d.querySelector('#replan').onclick();check(calls.find(c=>c.url==='/api/replan')?.body.content_type==='general','Replan preserves content type');check(calls.find(c=>c.url==='/api/replan')?.body.story_framework==='problem_solution','Replan sends story framework');
w.eval('state.active=false');d.querySelector('#newProject').onclick();check(d.querySelector('#storyFramework').value==='auto','New task resets framework');d.querySelector('[data-mode=script]').click();check(d.querySelector('#storyFrameworkHint').textContent.includes('按原文保留'),'Protected script explanation');d.querySelector('[data-mode=auto]').click();d.querySelector('#article').value='一般文章的示例正文';d.querySelector('#article').dispatchEvent(new w.Event('input'));check(d.querySelector('#storyFrameworkHint').textContent.includes('参考资料'),'Article is explicitly treated as writing source');d.querySelector('#storyFramework').value='source_order';d.querySelector('#contentType').value='general';await d.querySelector('#createButton').onclick();check(calls.find(c=>c.url==='/api/create')?.body.content_type==='general','General content type sent to generation');check(calls.find(c=>c.url==='/api/create')?.body.story_framework==='source_order','New generation sends selected story framework');document.querySelector('#app').width='390';await new Promise(r=>setTimeout(r,100));check(d.documentElement.scrollWidth<=w.innerWidth,'Mobile layout has no horizontal overflow');document.querySelector('#result').textContent=JSON.stringify({passed:true,checks});
}catch(e){document.querySelector('#result').textContent=JSON.stringify({passed:false,error:String(e),checks})}},1800);
</script>
