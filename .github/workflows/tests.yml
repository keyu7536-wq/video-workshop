name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-paper.txt
            requirements-dev.txt
      - name: Install Chinese fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/smoke_render.py
      - run: python scripts/build_release.py --check
