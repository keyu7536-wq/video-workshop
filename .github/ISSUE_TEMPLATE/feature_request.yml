name: 功能建议
description: 描述使用场景、遇到的障碍和希望达到的结果。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在制作什么内容？现有流程在哪一步不方便？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 可以提供可公开的示例；请区分必需行为和可选改进。
    validations:
      required: true
